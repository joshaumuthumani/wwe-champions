name: Graphify

on:
  pull_request:
    branches: [main]

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphify-freshness:
    name: Graph freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install graphify (pinned)
        run: pipx install graphifyy==0.9.53

      # Code layer is pure AST inside the runner: no key, no network, no local
      # machine involved. This is what the gate asserts on, which is why it
      # works on a fresh clone with zero credentials.
      - name: Assert graph freshness
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./.github/scripts/graphify-gate.sh "$HEAD_SHA"

      # Doc/semantic layer via OpenRouter only. Advisory — a provider outage
      # must never block a merge, and it never falls back to a local model.
      - name: Refresh doc corpus (OpenRouter)
        if: hashFiles('docs/**') != ''
        continue-on-error: true
        env:
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_KEY }}
          GRAPHIFY_OPENAI_MODEL: deepseek/deepseek-v4-flash
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::warning::OPENROUTER_KEY not set — doc layer not refreshed"
            exit 0
          fi
          graphify extract . --backend openai --update

      - name: Upload graph evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphify-out-${{ github.event.pull_request.head.sha }}
          path: graphify-out/
          retention-days: 14
