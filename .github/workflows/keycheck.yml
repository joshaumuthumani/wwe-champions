name: Key Check
on:
  push:
    branches: [agent/sdlc-pipeline-coordinator/690d78826b18]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe OPENROUTER_KEY validity
        env:
          K: ${{ secrets.OPENROUTER_KEY }}
        run: |
          if [ -z "$K" ]; then echo "secret ABSENT"; exit 0; fi
          echo "secret present, length=${#K}"
          CODE=$(curl -s -o /tmp/o.json -w '%{http_code}' https://openrouter.ai/api/v1/key -H "Authorization: Bearer $K")
          echo "GET /key -> HTTP $CODE"
          python3 -c "
import json
d=json.load(open('/tmp/o.json'))
print('error:', d['error']['message']) if 'error' in d else print('label:', d.get('data',{}).get('label'))
"
